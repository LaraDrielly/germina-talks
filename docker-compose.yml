services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: germina_talks
      POSTGRES_USER: germina
      POSTGRES_PASSWORD: germina_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: germina
      RUSTFS_SECRET_KEY: germina_local
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:
