services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: germina_talks
      POSTGRES_USER: germina
      POSTGRES_PASSWORD: germina_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: germina
      MINIO_ROOT_PASSWORD: germina_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
